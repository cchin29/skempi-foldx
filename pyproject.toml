[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "skempi-foldx"
version = "0.1.0"
description = "FoldX binding ddG for SKEMPI 2.0: the pipeline, and the computed results"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC-BY-4.0"
# NOTICE carries the CC BY 4.0 identification and the statement of modification that must
# travel with the data, and LICENSE points at it -- so it has to be in the artifact too.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Connor Chin", email = "cchin29@stanford.edu" }]
keywords = ["FoldX", "SKEMPI", "ddG", "protein-protein interaction", "binding affinity"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Deliberately empty. Reading the shipped results needs nothing beyond the standard library,
# which is most of the point -- a consumer should not inherit a numeric stack to look up a
# per-mutation energy. Running the pipeline needs a FoldX 5 binary, which is not a Python
# dependency and is not redistributable.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/cchin29/skempi-foldx"
Repository = "https://github.com/cchin29/skempi-foldx"

[tool.setuptools]
packages = ["skempi_foldx"]

# The results ARE the deliverable, so they must be in the wheel. They must live inside the
# package directory: a top-level data/ is unreachable by any packaging directive, so
# `pip install skempi-foldx` shipped the pipeline and none of the results, and the README's
# own quickstart returned an empty store.
[tool.setuptools.package-data]
skempi_foldx = ["data/results_sp/*.json", "data/results_mp/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
